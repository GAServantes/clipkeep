name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-gi gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 gir1.2-webkit2-4.1 shellcheck
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Lint
        run: |
          python3 -m py_compile clipkeep.py tests/*.py
          shellcheck install.sh
